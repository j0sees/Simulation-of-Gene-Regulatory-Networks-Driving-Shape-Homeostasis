[project]
name = "grn-shape-homeostasis"
version = "0.2.0"
description = "Simulation and classification of Gene Regulatory Networks (GRNs) driving shape homeostasis in multicellular systems"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "J. Esteban Pérez-Hidalgo" },
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "matplotlib>=3.8.0",
    "networkx>=3.2.0",
    "numba>=0.59.0",
    "neat-python>=0.92",
    "streamlit>=1.38.0",
    "plotly>=5.22.0",
    "pandas>=2.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "evolution", "visualization", "analysis", "config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E402"]
