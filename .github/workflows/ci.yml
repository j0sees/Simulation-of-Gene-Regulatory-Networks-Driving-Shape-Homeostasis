name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --dev

      - name: Validate shell scripts
        run: bash -n run_docker.sh run_web_app.sh

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Compile Python modules
        run: >-
          uv run python -m compileall -q
          core evolution visualization analysis examples tests
          web_app.py neat_cell_agent.py neat_parallel.py

      - name: Run unit tests with pytest
        run: uv run pytest -v

  docker-build:
    name: Docker Build & Smoke Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t grn-simulation:ci .

      - name: Verify container imports
        run: >-
          docker run --rm -e MPLBACKEND=Agg grn-simulation:ci
          python -c "import core.main, evolution.main_ga, visualization.plot, web_app"

